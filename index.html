<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معلوماتي الشخصية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>💡 مشروع المعلومات الشخصية</h1>
        <div class="info-box">
            <p>📌 افتح <strong>Console</strong> لرؤية النتيجة</p>
            <p>اضغط <kbd>F12</kbd> أو <kbd>Ctrl + Shift + I</kbd></p>
        </div>
        
        <div class="output" id="output">
            <h2>📊 النتيجة ستظهر هنا:</h2>
            <div id="result"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
